spring.application.name=tracecar-api

# Banco (docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tracecar}
spring.datasource.username=${DB_USER:tracecar}
spring.datasource.password=${DB_PASSWORD:tracecar}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# CORS para o front (separar por virgula)
tracecar.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

management.endpoints.web.exposure.include=health,info
