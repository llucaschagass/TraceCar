name: tracecar

services:
  db:
    image: postgres:17-alpine
    container_name: tracecar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tracecar
      POSTGRES_USER: tracecar
      POSTGRES_PASSWORD: tracecar
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - tracecar-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracecar -d tracecar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API containerizada (opcional): docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: .
    container_name: tracecar-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/tracecar
      DB_USER: tracecar
      DB_PASSWORD: tracecar
    ports:
      - "8080:8080"

volumes:
  tracecar-data:
